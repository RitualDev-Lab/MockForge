name: 💡 Feature Request
description: Propose a new feature, database exporter, or generator rule for MockForge
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your ideas to improve MockForge!
  - type: input
    id: feature_title
    attributes:
      label: Feature Summary
      placeholder: e.g. Support Cassandra CQL schema or Drizzle ORM exporter
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use Case & Motivation
      description: Why would this feature be useful for your engineering workflow or CI/CD pipelines?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / API Design
      description: Describe how you envision this working.
    validations:
      false
