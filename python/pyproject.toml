[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mockforge"
version = "0.1.0"
description = "Enterprise In-Memory Relational Mock Database & Test Data Synthesis Engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [
  { name = "RitualDev Studio", email = "engineering@ritualdev.in" }
]
keywords = ["mock-database", "synthetic-data", "relational-generator", "pytest", "sql-generator", "test-fixtures"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3"
]

[project.urls]
Homepage = "https://github.com/RitualDev-Lab/MockForge"
